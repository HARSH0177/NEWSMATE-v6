<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="primaryAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <pattern id="dotPattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94A3B8" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#dotPattern)"/>
  
  <!-- Subtle Top Glowing Accent Line -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#primaryAccent)"/>

  <!-- Top Pill / Badge -->
  <g transform="translate(600, 48)" text-anchor="middle">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
    <circle cx="-142" cy="0" r="5" fill="#2563EB"/>
    <text x="8" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" letter-spacing="0.5">
      PRODUCTION CRAG FACT-CHECKING ENGINE
    </text>
  </g>

  <!-- Title & Subtitle -->
  <text x="600" y="115" text-anchor="middle" font-family="'Lora', Georgia, -apple-system, serif" font-size="44" font-weight="700" fill="#0F172A" letter-spacing="-1">
    News<tspan fill="#2563EB">Mate</tspan>
  </text>
  <text x="600" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#475569">
    Real-Time Multi-Agent News Verification • Corrective RAG (CRAG) • Multi-Source MCP Grounding
  </text>

  <!-- Agent Chips Row -->
  <g transform="translate(600, 192)" text-anchor="middle">
    <!-- Agent 1: Orchestrator -->
    <g transform="translate(-315, 0)">
      <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#dropShadow)"/>
      <circle cx="-70" cy="0" r="4.5" fill="#3B82F6"/>
      <text x="8" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#1E293B">🎯 Orchestrator Agent</text>
    </g>
    <!-- Agent 2: MCP Retrieval -->
    <g transform="translate(-105, 0)">
      <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#dropShadow)"/>
      <circle cx="-70" cy="0" r="4.5" fill="#10B981"/>
      <text x="8" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#1E293B">🌐 MCP Web Scraper</text>
    </g>
    <!-- Agent 3: Fact Auditor -->
    <g transform="translate(105, 0)">
      <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#dropShadow)"/>
      <circle cx="-70" cy="0" r="4.5" fill="#F59E0B"/>
      <text x="8" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#1E293B">⚖️ CRAG Fact Auditor</text>
    </g>
    <!-- Agent 4: Synthesis Explainer -->
    <g transform="translate(315, 0)">
      <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#dropShadow)"/>
      <circle cx="-70" cy="0" r="4.5" fill="#8B5CF6"/>
      <text x="8" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#1E293B">✍️ Synthesis Explainer</text>
    </g>
  </g>

  <!-- 3 Key Metric Cards -->
  <g transform="translate(120, 240)">
    <!-- Metric Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="290" height="135" rx="14" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#dropShadow)"/>
      <rect x="0" y="0" width="290" height="4" rx="2" fill="url(#greenGrad)"/>
      <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#059669" letter-spacing="0.5">FACTUAL ACCURACY</text>
      <text x="24" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="800" fill="#0F172A">100%</text>
      <text x="140" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#64748B">(16 / 16)</text>
      <text x="24" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#475569">Zero false positives on scientific facts</text>
    </g>

    <!-- Metric Card 2 -->
    <g transform="translate(335, 0)">
      <rect width="290" height="135" rx="14" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#dropShadow)"/>
      <rect x="0" y="0" width="290" height="4" rx="2" fill="url(#primaryAccent)"/>
      <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="0.5">AVG VERIFICATION LATENCY</text>
      <text x="24" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="800" fill="#0F172A">~9.8s</text>
      <text x="145" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#64748B">/ claim</text>
      <text x="24" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#475569">Real-time async MCP scraping + LLM eval</text>
    </g>

    <!-- Metric Card 3 -->
    <g transform="translate(670, 0)">
      <rect width="290" height="135" rx="14" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#dropShadow)"/>
      <rect x="0" y="0" width="290" height="4" rx="2" fill="url(#goldGrad)"/>
      <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#D97706" letter-spacing="0.5">RATE-LIMIT DOWNTIME</text>
      <text x="24" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="800" fill="#0F172A">0%</text>
      <text x="95" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#059669">✓ 5-Key Rotator</text>
      <text x="24" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#475569">40 claims completed with zero API stalls</text>
    </g>
  </g>
</svg>
