<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="tier1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="tier2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="tier3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="tier4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="780" fill="url(#bgG)"/>
  
  <!-- Header Block -->
  <g transform="translate(500, 45)" text-anchor="middle">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A" letter-spacing="0.5">
      NEWSMATE 4-TIER MULTI-AGENT ARCHITECTURE
    </text>
  </g>

  <!-- ════════════ TIER 1: CLIENT & INTERFACE LAYER ════════════ -->
  <g transform="translate(60, 95)">
    <rect width="880" height="125" rx="14" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="8" height="125" rx="4" fill="url(#tier1Grad)"/>
    
    <text x="24" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#1D4ED8" letter-spacing="0.5">
      TIER 1: INTERFACE &amp; CLIENT STREAMING LAYER
    </text>
    <text x="24" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="500" fill="#64748B">
      Handles concurrent user ingestion, real-time stage progress broadcasting, and responsive user rendering.
    </text>

    <!-- Blocks inside Tier 1 -->
    <g transform="translate(24, 60)">
      <!-- Box 1 -->
      <rect width="265" height="50" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0F172A">🖥️ Glassmorphic Client UI</text>
      <text x="14" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Real-time dynamic verdict cards &amp; logs</text>

      <!-- Box 2 -->
      <rect x="285" width="265" height="50" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="299" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0F172A">⚡ Express REST Server (v6)</text>
      <text x="299" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" fill="#64748B">POST /api/verify • Port 3000 • CORS safe</text>

      <!-- Box 3 -->
      <rect x="570" width="265" height="50" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="584" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0F172A">📡 WebSockets / SSE Channel</text>
      <text x="584" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Sub-second multi-stage progress streaming</text>
    </g>
  </g>

  <!-- Arrow 1 to 2 -->
  <g transform="translate(500, 232)" text-anchor="middle" fill="#64748B">
    <path d="M 0 0 L 0 16 M -4 10 L 0 16 L 4 10" stroke="#94A3B8" stroke-width="2" fill="none"/>
  </g>

  <!-- ════════════ TIER 2: MULTI-AGENT ORCHESTRATION LAYER ════════════ -->
  <g transform="translate(60, 255)">
    <rect width="880" height="135" rx="14" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="8" height="135" rx="4" fill="url(#tier2Grad)"/>

    <text x="24" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#6D28D9" letter-spacing="0.5">
      TIER 2: MULTI-AGENT ORCHESTRATION PIPELINE
    </text>
    <text x="24" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="500" fill="#64748B">
      Specialized autonomous agents executing query planning, grounded auditing, consensus reasoning, and report generation.
    </text>

    <!-- 4 Agents Row -->
    <g transform="translate(24, 62)">
      <!-- Agent 1 -->
      <rect width="198" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">🎯 Orchestrator Agent</text>
      <text x="12" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#64748B">Entity parsing &amp; query formulation</text>
      <text x="12" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#7C3AED">Gemini 1.5 Flash • Call 1/3</text>

      <!-- Agent 2 -->
      <rect x="212" width="198" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="224" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">🔍 Retrieval Agent</text>
      <text x="224" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#64748B">Multi-source news aggregator</text>
      <text x="224" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#059669">MCP SDK + Playwright</text>

      <!-- Agent 3 -->
      <rect x="424" width="198" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="436" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">⚖️ Fact Auditor Agent</text>
      <text x="436" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#64748B">Evidence consistency check</text>
      <text x="436" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#D97706">CRAG Threshold Scoring</text>

      <!-- Agent 4 -->
      <rect x="636" width="198" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="648" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">✍️ Synthesis Explainer</text>
      <text x="648" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#64748B">Plain-language verdict report</text>
      <text x="648" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#7C3AED">Gemini 1.5 Flash • Call 3/3</text>
    </g>
  </g>

  <!-- Arrow 2 to 3 -->
  <g transform="translate(500, 402)" text-anchor="middle" fill="#64748B">
    <path d="M 0 0 L 0 16 M -4 10 L 0 16 L 4 10" stroke="#94A3B8" stroke-width="2" fill="none"/>
  </g>

  <!-- ════════════ TIER 3: CRAG & RETRIEVAL ENGINE ════════════ -->
  <g transform="translate(60, 425)">
    <rect width="880" height="135" rx="14" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="8" height="135" rx="4" fill="url(#tier3Grad)"/>

    <text x="24" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#047857" letter-spacing="0.5">
      TIER 3: CORRECTIVE RAG (CRAG) &amp; SEARCH ENGINE LAYER
    </text>
    <text x="24" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="500" fill="#64748B">
      Extracts, cleans, and cross-references live articles against 19 trusted news outlets with dynamic fallback mechanisms.
    </text>

    <!-- Blocks inside Tier 3 -->
    <g transform="translate(24, 62)">
      <rect width="265" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0F172A">🎭 Playwright MCP Engine</text>
      <text x="14" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Headless JS rendering &amp; DOM parsing</text>
      <text x="14" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#047857">Bypasses Cloudflare &amp; client JS locks</text>

      <rect x="285" width="265" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="299" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0F172A">🛡️ 19-Source Whitelist</text>
      <text x="299" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Reuters, BBC, AP News, The Hindu, etc.</text>
      <text x="299" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#047857">Domain integrity &amp; spam filtering</text>

      <rect x="570" width="265" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="584" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0F172A">🔄 CRAG Corrective Evaluator</text>
      <text x="584" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Confidence threshold &lt; 0.70 trigger</text>
      <text x="584" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#D97706">Fallback to Training Knowledge for facts</text>
    </g>
  </g>

  <!-- Arrow 3 to 4 -->
  <g transform="translate(500, 572)" text-anchor="middle" fill="#64748B">
    <path d="M 0 0 L 0 16 M -4 10 L 0 16 L 4 10" stroke="#94A3B8" stroke-width="2" fill="none"/>
  </g>

  <!-- ════════════ TIER 4: RESILIENCE & EXECUTION LAYER ════════════ -->
  <g transform="translate(60, 595)">
    <rect width="880" height="135" rx="14" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="8" height="135" rx="4" fill="url(#tier4Grad)"/>

    <text x="24" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#B45309" letter-spacing="0.5">
      TIER 4: RESILIENCE, PERSISTENCE &amp; BENCHMARK HARNESS
    </text>
    <text x="24" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="500" fill="#64748B">
      Fault-tolerant key management, state checkpointing, and continuous empirical accuracy evaluation.
    </text>

    <!-- Blocks inside Tier 4 -->
    <g transform="translate(24, 62)">
      <rect width="265" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0F172A">🔑 5-Key Round-Robin Rotator</text>
      <text x="14" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Bypasses 20 RPM Gemini free quota limits</text>
      <text x="14" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#B45309">Instant failover on HTTP 429/503</text>

      <rect x="285" width="265" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="299" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0F172A">💾 Atomic State Persistence</text>
      <text x="299" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" fill="#64748B">JSON checkpoint &amp; CSV stream export</text>
      <text x="299" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#B45309">Zero data loss on process restarts</text>

      <rect x="570" width="265" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="584" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0F172A">📊 40-Claim Benchmark Harness</text>
      <text x="584" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Multi-domain precision scoring</text>
      <text x="584" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#059669">100% Factual • 62.5% Weighted Accuracy</text>
    </g>
  </g>
</svg>
