    <rect width="200" height="4" rx="2" fill="#10B981"/>
    <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#059669">STEP 3: WEB SCRAPER</text>
