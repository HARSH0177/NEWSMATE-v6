  <!-- Convergence Arrows -->
  <path d="M 300 440 L 350 440 M 344 435 L 350 440 L 344 445" stroke="#3B82F6" stroke-width="1.8" fill="none"/>
  <path d="M 630 440 L 580 440 M 586 435 L 580 440 L 586 445" stroke="#3B82F6" stroke-width="1.8" fill="none"/>
</svg>
