  <path d="M 720 145 L 760 145 L 760 230 M 755 224 L 760 230 L 765 224" stroke="#94A3B8" stroke-width="2" fill="none"/>

  <!-- ═════════ STEP 4: CRAG CONFIDENCE EVALUATOR (CENTRAL DIAMOND/BOX) ═════════ -->
  <g transform="translate(430, 240)">
    <rect x="-160" width="320" height="110" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.8" filter="url(#fShadow)"/>
    <rect x="-160" width="320" height="5" rx="2" fill="url(#evalGrad)"/>
