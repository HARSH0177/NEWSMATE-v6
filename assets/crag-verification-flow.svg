  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 240 145 L 280 145 M 274 140 L 280 145 L 274 150" stroke="#94A3B8" stroke-width="2" fill="none"/>

  <!-- Step 2: Orchestration & Search Formulation -->
  <g transform="translate(280, 100)">
