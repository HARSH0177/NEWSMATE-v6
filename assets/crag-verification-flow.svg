  <!-- Path YES: High Confidence -->
  <path d="M 270 295 L 180 295 L 180 390 M 175 384 L 180 390 L 185 384" stroke="#10B981" stroke-width="2" fill="none"/>
  <rect x="195" y="278" width="60" height="20" rx="4" fill="#D1FAE5"/>
  <text x="225" y="292" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#065F46">PASS [YES]</text>

