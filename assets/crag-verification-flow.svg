  <path d="M 590 295 L 750 295 L 750 390 M 745 384 L 750 390 L 755 384" stroke="#DC2626" stroke-width="2" fill="none"/>
  <rect x="610" y="278" width="115" height="20" rx="4" fill="#FEE2E2"/>
  <text x="667" y="292" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#991B1B">FAIL / 0 SOURCES</text>

