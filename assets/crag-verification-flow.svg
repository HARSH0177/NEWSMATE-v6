    <text x="14" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#475569">Verified scientific &amp; historical ground truth</text>
    <text x="14" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#DC2626">Eliminates 0-source False Unverifieds</text>
