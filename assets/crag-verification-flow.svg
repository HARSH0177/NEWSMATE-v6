    <rect width="200" height="4" rx="2" fill="#8B5CF6"/>
    <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#7C3AED">STEP 2: ORCHESTRATION</text>
    <text x="16" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#0F172A">Query Formulation</text>
    <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#64748B">Gemini 1.5 Flash query planner</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 480 145 L 520 145 M 514 140 L 520 145 L 514 150" stroke="#94A3B8" stroke-width="2" fill="none"/>

  <!-- Step 3: MCP Multi-Source Web Scraper -->
  <g transform="translate(520, 100)">
