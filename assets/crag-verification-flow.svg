    </text>
  </g>

  <!-- Flow Steps -->
  <!-- Step 1: Input Claim -->
  <g transform="translate(60, 100)">
    <rect width="180" height="90" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#fShadow)"/>
    <rect width="180" height="4" rx="2" fill="#3B82F6"/>
    <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#2563EB">STEP 1: INGESTION</text>
    <text x="16" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#0F172A">Raw User Claim</text>
